services:
  mongo:
    image: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example


  redis:
    image: redis
    command: redis-server  --requirepass EOM*191721*UNR --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
volumes:
  redis_data:
